<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeSmart - 4 Steps Tuning Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar for Controls */
        #sidebar {
            width: 350px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--primary); font-weight: 600; }
        h2 { font-size: 1rem; margin: 1rem 0 0.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.3rem; color: var(--text-dim); }

        .control-group { display: flex; flex-direction: column; gap: 0.8rem; }
        .control { display: flex; flex-direction: column; gap: 0.3rem; }
        .control label { display: flex; justify-content: space-between; font-size: 0.9rem; }
        .control label span { color: var(--primary); font-weight: 600; }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Main Viewport */
        #viewport {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            gap: 1.5rem;
        }

        .header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; }
        .stage {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .stage span { position: absolute; top: 0.5rem; left: 0.8rem; font-size: 0.75rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
        canvas { max-width: 100%; max-height: 100%; border-radius: 4px; background: #000; }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

        .profiles { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .profile-btn { 
            font-size: 0.75rem; padding: 0.3rem 0.6rem; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim); border-radius: 4px; cursor: pointer;
        }
        .profile-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>BeeSmart Tuning</h1>
        
        <div class="control-group">
            <h2>Profiles</h2>
            <div class="profiles" id="profileList">
                <button class="profile-btn active" onclick="loadProfile('default')">Default</button>
                <button class="profile-btn" onclick="loadProfile('aggressive')">Aggressive</button>
                <button class="profile-btn" onclick="loadProfile('lite')">Lite</button>
            </div>
        </div>

        <div class="control-group">
            <h2>Step 1: Preprocessing</h2>
            <div class="control">
                <label>Threshold <span></span></label>
                <input type="range" id="threshold_value" min="0" max="255" value="128">
            </div>
            <div class="control">
                <label>Morph Repair Iterations <span></span></label>
                <input type="range" id="morph_repair_iterations" min="0" max="5" value="1">
            </div>
            <div class="control">
                <label>K-Means K <span></span></label>
                <input type="range" id="kmeans_k" min="1" max="20" value="1">
            </div>
        </div>

        <div class="control-group">
            <h2>Step 2: Core Segmentation</h2>
            <div class="control">
                <label>Min Area <span></span></label>
                <input type="range" id="shape_filter_min_area" min="5" max="200" value="50">
            </div>
        </div>

        <div class="control-group">
            <h2>Step 3: Splitting</h2>
            <div class="control">
                <label>Target Area <span></span></label>
                <input type="range" id="target_area" min="50" max="1000" value="450">
            </div>
            <div class="control">
                <label>Max Normal Area <span></span></label>
                <input type="range" id="max_normal_area" min="100" max="3000" value="800">
            </div>
            <div class="control">
                <label>Solidity Threshold <span></span></label>
                <input type="range" id="solidity_threshold" min="0" max="100" value="45">
            </div>
            <div class="control">
                <label>Aspect Ratio <span></span></label>
                <input type="range" id="aspect_ratio_threshold" min="10" max="50" value="25">
            </div>
        </div>

        <div class="control-group">
            <h2>Step 4: Validation</h2>
            <div class="control">
                <label>Merge Distance <span></span></label>
                <input type="range" id="merge_distance" min="0" max="100" value="30">
            </div>
        </div>

        <div style="margin-top: auto; display: flex; gap: 0.5rem;">
            <button class="btn" style="flex: 1;" onclick="saveParams()">Save to Go</button>
            <button class="btn btn-secondary" onclick="loadParams()">Reset</button>
        </div>
    </div>

    <div id="viewport">
        <div class="header">
            <div>
                Video Time: <input type="number" id="videoTime" value="10" style="width: 50px; background: none; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 2px;"> s
                <button class="btn-secondary" style="padding: 2px 8px; font-size: 0.8rem;" onclick="refreshFrame()">Refresh Frame</button>
            </div>
            <div id="stats" style="color: var(--text-dim); font-size: 0.8rem;">
                Blobs: <span id="blobCount" style="color: var(--primary);">0</span>
            </div>
        </div>

        <div class="stage">
            <span>Step 1: Binary & Repair</span>
            <canvas id="canvas1"></canvas>
        </div>
        <div class="stage">
            <span>Step 2: Core Blobs</span>
            <canvas id="canvas2"></canvas>
        </div>
        <div class="stage">
            <span>Step 3: Splitting Results</span>
            <canvas id="canvas3"></canvas>
        </div>
        <div class="stage">
            <span>Step 4: Validated Detection</span>
            <canvas id="canvas4"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
